version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./black_diamond:/app/black_diamond
      - ./examples:/app/examples
    command: start --backend

  # Frontend service is optional and requires a frontend directory with a React app.
  # Uncomment and adapt the paths below when a frontend project is added.
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: ../docker/Dockerfile.frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - VITE_API_URL=http://backend:5000
  #   depends_on:
  #     - backend
  #   command: npm run dev -- --host 0.0.0.0

  # optional database service for future stateful launcher
  # redis:
  #   image: redis:alpine
  #   ports:
  #     - "6379:6379"
